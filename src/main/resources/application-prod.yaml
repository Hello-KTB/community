spring:
  datasource:
    # EC2 내부 MySQL 연결 URL (EC2 로컬에 MySQL 직접 설치했으므로 localhost 사용)
    # 서버 시간대는 UTC로 설정, SSL 암호화 연결 비활성화, RSA 공개키 조회 허용
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    # EC2 DB 접속 계정 정보 (로컬 root 계정과 분리해서 관리)
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 운영 환경에서는 절대 create 사용 금지 → 기존 데이터 전부 삭제됨
      ddl-auto: update

  data:
    redis:
      host: ${DB_HOST}
      port: 6379

  jwt:
    secret-key: ${JWT_SECRET_KEY}

  # Spring Cloud AWS S3 설정 (spring: 하위에 계층 맞춤)
  cloud:
    aws:
      s3:
        bucket: ${AWS_S3_BUCKET}
      region:
        static: ${AWS_REGION:ap-northeast-2}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}

# Actuator 헬스체크 관련 설정 (k8s 헬스체크용)
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: community-app